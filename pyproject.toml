[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-analysis"
version = "0.1.0"
description = "Pipeline local e reproduzível para análise financeira pessoal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaleido>=1.0,<2",
    "plotly>=6.1.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["finance_analysis*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
