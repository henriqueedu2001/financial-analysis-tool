[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analysis-tool"
version = "0.1.0"
description = "Ferramenta local e auditavel para analise financeira pessoal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["finance*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
